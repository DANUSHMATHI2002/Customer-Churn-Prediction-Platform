version: "3.9"
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      - DATABASE_URL=postgresql://churn:churn@db:5432/churn_db
      - REDIS_HOST=redis
    depends_on: [db, redis]

  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.port 8501
    ports: ["8501:8501"]
    depends_on: [api]

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: churn
      POSTGRES_PASSWORD: churn
      POSTGRES_DB: churn_db
    volumes: [pg_data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine

volumes:
  pg_data:
